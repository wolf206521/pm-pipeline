interface:
  display_name: "pm-pipeline · 多模块需求工程流水线"
  short_description: "把散落客户需求 docx 变成可续跑、可审计、可交付的结构化工程:五阶段循环+确认闸门+记忆体系+基线机制+四个 Python 脚本。"
  default_prompt: "用 pm-pipeline,针对【企业级订单管理系统,12 个模块,客户逐阶段确认】初始化需求工程体系。要求:建立四层目录骨架(体系/记忆/需求输入/模块),从源资料目录生成基线与提取缓存,为首个模块跑通 S1 需求采集并产出 G1 需求确认单。所有脚本用 Python 3 跨平台执行。"
